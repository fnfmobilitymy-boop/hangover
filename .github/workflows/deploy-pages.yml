name: Deploy artist demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artist-site"
          cp index.html style.css app.js "$RUNNER_TEMP/artist-site/"
          cp -R assets "$RUNNER_TEMP/artist-site/assets"
          chmod -R a+rX "$RUNNER_TEMP/artist-site"
          touch "$RUNNER_TEMP/artist-site/.nojekyll"
          test -s "$RUNNER_TEMP/artist-site/index.html"
          test -s "$RUNNER_TEMP/artist-site/assets/artist-film.mp4"
          node --check "$RUNNER_TEMP/artist-site/app.js"
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/artist-site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
