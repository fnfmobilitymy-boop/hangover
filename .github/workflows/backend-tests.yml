name: Test KENNY backend
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'tests/**'
      - 'requirements*'
      - 'backend-client.js'
      - 'Dockerfile'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'tests/**'
      - 'requirements*'
      - 'backend-client.js'
      - 'Dockerfile'
      - '.github/workflows/backend-tests.yml'
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check backend-client.js && node --check admin/app.js
