name: Deploy KENNY demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out KENNY
        uses: actions/checkout@v4
      - name: Validate and prepare website
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check i18n.js
          node --check social-links.js
          node --check features.js
          python3 scripts/validate-site.py
          mkdir -p "$RUNNER_TEMP/kenny-site"
          cp *.html style.css cinema.css typography.css app.js i18n.js social-links.js features.js "$RUNNER_TEMP/kenny-site/"
          cp -R assets "$RUNNER_TEMP/kenny-site/assets"
          chmod -R a+rX "$RUNNER_TEMP/kenny-site"
          touch "$RUNNER_TEMP/kenny-site/.nojekyll"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload KENNY website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/kenny-site
      - name: Publish KENNY
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published KENNY website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 20 "$SITE_URL" -o "$RUNNER_TEMP/published-kenny.html"
          python3 - "$RUNNER_TEMP/published-kenny.html" <<'PY'
          import sys
          from pathlib import Path
          html = Path(sys.argv[1]).read_text()
          for expected in ('KENNY', 'i18n.js', 'social-links.js', 'data-page="index"'):
              if expected not in html:
                  raise SystemExit(f'Published website is missing {expected}')
          print('Published KENNY demo verified')
          PY
